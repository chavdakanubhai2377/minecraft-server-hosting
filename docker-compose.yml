version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: pghost-postgres
    environment:
      POSTGRES_USER: pghost_user
      POSTGRES_PASSWORD: pghost_password_secure
      POSTGRES_DB: pghost_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - pghost-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pghost_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: pghost-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - pghost-network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API (NestJS)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pghost-backend
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://pghost_user:pghost_password_secure@postgres:5432/pghost_db
      REDIS_URL: redis://redis:6379
      JWT_SECRET: your_jwt_secret_key_change_this
      JWT_EXPIRATION: 24h
      API_PORT: 3001
      API_HOST: 0.0.0.0
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - pghost-network
    volumes:
      - ./backend:/app
      - /app/node_modules
    restart: unless-stopped

  # Frontend (Next.js)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pghost-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - pghost-network
    volumes:
      - ./frontend:/app
      - /app/node_modules
    restart: unless-stopped

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: pghost-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    networks:
      - pghost-network
    restart: unless-stopped

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: pghost-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - pghost-network
    restart: unless-stopped

  # Grafana Dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: pghost-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    ports:
      - "3005:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - pghost-network
    restart: unless-stopped

  # Server Daemon (Custom server management)
  daemon:
    build:
      context: ./daemon
      dockerfile: Dockerfile
    container_name: pghost-daemon
    environment:
      DATABASE_URL: postgresql://pghost_user:pghost_password_secure@postgres:5432/pghost_db
      REDIS_URL: redis://redis:6379
      DAEMON_PORT: 3002
      DAEMON_HOST: 0.0.0.0
      DOCKER_HOST: unix:///var/run/docker.sock
    ports:
      - "3002:3002"
    depends_on:
      - postgres
      - redis
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./daemon:/app
      - /app/node_modules
      - pghost_servers:/servers
    networks:
      - pghost-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  pghost_servers:
    driver: local

networks:
  pghost-network:
    driver: bridge
